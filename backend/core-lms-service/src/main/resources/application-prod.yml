# Profile "prod": NO defaults for secrets — the service refuses to start if they are not provided (see ProdSecretsGuard).
spring:
  flyway:
    url: ${DB_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    ssl:
      enabled: ${RABBIT_SSL:false}   # Amazon MQ requires TLS (port 5671)
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
oep:
  datasource:
    primary:
      jdbc-url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
    replica:
      jdbc-url: ${DB_REPLICA_URL}
      username: ${DB_REPLICA_USER}
      password: ${DB_REPLICA_PASSWORD}
  jwt:
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}      # alternative to the file: PEM text from a secret manager
    previous-public-key-files: ${JWT_PREVIOUS_PUBLIC_KEY_FILES:}
  admin:
    seed:
      email: ${ADMIN_SEED_EMAIL}
      password: ${ADMIN_SEED_PASSWORD}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET}
    # empty endpoint = real AWS S3 (credentials from the IAM role unless keys are set)
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    auto-create-bucket: ${STORAGE_AUTO_CREATE_BUCKET:false}
    cors-origins: ${STORAGE_CORS_ORIGINS:}

server:
  forward-headers-strategy: framework   # honour X-Forwarded-* from the load balancer
  tomcat:
    max-swallow-size: 2MB
logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
springdoc:
  api-docs:
    enabled: false      # no API schema / Swagger UI on production
  swagger-ui:
    enabled: false

# Operational endpoints live on a separate, internal-only port (never routed by the gateway / load balancer).
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
