server:
  port: 8081

spring:
  application:
    name: core-lms-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}

oep:
  datasource:
    routing-enabled: true
    primary:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/oep}
      username: ${DB_USER:oep}
      password: ${DB_PASSWORD:oep}
    replica:
      jdbc-url: ${DB_REPLICA_URL:jdbc:postgresql://localhost:5433/oep}
      username: ${DB_REPLICA_USER:oep}
      password: ${DB_REPLICA_PASSWORD:oep}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:oep}
    secret-key: ${MINIO_SECRET_KEY:oep_secret}
    bucket-raw: ${MINIO_BUCKET_RAW:oep-raw}
    bucket-hls: ${MINIO_BUCKET_HLS:oep-hls}
    bucket-thumbnails: ${MINIO_BUCKET_THUMBNAILS:oep-thumbnails}
    presigned-put-ttl-minutes: 15
    presigned-get-ttl-seconds: 3600
jwt:
  issuer: ${JWT_ISSUER:http://localhost:8081}
  access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:60}
  refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:14}

logging:
  level:
    com.oep.corelms: INFO
    org.springframework.security: INFO
