server:
  shutdown: graceful
  port: 8081

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: core-lms-service
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (db/migration); Hibernate only verifies it
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # existing databases (created by the old ddl-auto) are baselined at V1, fresh ones run V1
    baseline-version: 1
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oep}   # always the primary, never the routing datasource
    user: ${DB_USER:oep}
    password: ${DB_PASSWORD:oep}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}

oep:
  datasource:
    routing-enabled: true
    primary:
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/oep}
      username: ${DB_USER:oep}
      password: ${DB_PASSWORD:oep}
    replica:
      jdbc-url: ${DB_REPLICA_URL:jdbc:postgresql://localhost:5433/oep}
      username: ${DB_REPLICA_USER:oep}
      password: ${DB_REPLICA_PASSWORD:oep}
  jwt:
    issuer: oep-core-lms
    access-ttl-seconds: 900
    refresh-ttl-seconds: 2592000
  admin:
    seed:
      email: ${ADMIN_SEED_EMAIL:admin@oep.local}
      password: ${ADMIN_SEED_PASSWORD:Admin@12345}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:oep}
    secret-key: ${STORAGE_SECRET_KEY:oep_secret}
    bucket: ${STORAGE_BUCKET:oep-content}
    region: us-east-1
    upload-url-ttl-seconds: 900
    view-url-ttl-seconds: 600
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
