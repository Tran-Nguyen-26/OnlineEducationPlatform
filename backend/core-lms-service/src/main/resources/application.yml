server:
  port: 8081

spring:
  application:
    name: core-lms-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oep}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:shizadon2005}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}

jwt:
  issuer: ${JWT_ISSUER:http://localhost:8081}
  access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:60}
  refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:14}

logging:
  level:
    com.oep.corelms: INFO
    org.springframework.security: INFO
