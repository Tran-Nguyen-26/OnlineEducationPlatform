server:
  port: 8081

spring:
  application:
    name: core-lms-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}

oep:
  storage:
    endpoint: ${OEP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${OEP_STORAGE_ACCESS_KEY:oep}
    secret-key: ${OEP_STORAGE_SECRET_KEY:oep-minio-secret}
    bucket: ${OEP_STORAGE_BUCKET:oep-course-content}
    region: ${OEP_STORAGE_REGION:us-east-1}
    upload-url-ttl-seconds: ${OEP_STORAGE_UPLOAD_URL_TTL_SECONDS:600}
    access-url-ttl-seconds: ${OEP_STORAGE_ACCESS_URL_TTL_SECONDS:300}
  datasource:
    routing-enabled: true
    primary:
      url: ${DB_URL:jdbc:postgresql://localhost:5434/oep}
      username: ${DB_USER:oep}
      password: ${DB_PASSWORD:oep}
    replica:
      url: ${DB_REPLICA_URL:jdbc:postgresql://localhost:5435/oep}
      username: ${DB_REPLICA_USER:oep}
      password: ${DB_REPLICA_PASSWORD:oep}
jwt:
  issuer: ${JWT_ISSUER:http://localhost:8081}
  access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:60}
  refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:14}

logging:
  level:
    com.oep.corelms: INFO
    org.springframework.security: INFO
