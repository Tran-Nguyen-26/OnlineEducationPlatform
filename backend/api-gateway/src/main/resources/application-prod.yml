spring:
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # exact production origins only (no localhost / private-network patterns)
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS}

# Operational endpoints live on a separate, internal-only port (never routed by the gateway / load balancer).
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
oep:
  gateway:
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}   # nginx (frontend container) / ALB in front of the gateway
