server:
  shutdown: graceful
  port: 8082

spring:
  profiles:
    default: dev   # running without SPRING_PROFILES_ACTIVE means "dev"; Docker images activate "prod"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: assessment-service
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50   # collapses N+1 lazy loads into IN (...) batches
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Core LMS is the token issuer; this service only validates.
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

oep:
  datasource:
    # readOnly transactions go to the replica, everything else to the primary (same mechanism as core-lms-service)
    routing-enabled: true
    primary:
      connection-timeout: 3000      # fail fast when the database is down (default 30 s)
      validation-timeout: 2000
      maximum-pool-size: 20
      jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/oep}
      username: ${DB_USER:oep}
      password: ${DB_PASSWORD:oep}
    replica:
      connection-timeout: 3000      # fail fast when the database is down (default 30 s)
      validation-timeout: 2000
      maximum-pool-size: 20
      jdbc-url: ${DB_REPLICA_URL:jdbc:postgresql://localhost:5433/oep}
      username: ${DB_REPLICA_USER:oep}
      password: ${DB_REPLICA_PASSWORD:oep}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:oep}
    secret-key: ${STORAGE_SECRET_KEY:oep_secret}
    bucket: ${STORAGE_BUCKET:oep-content}
    region: us-east-1
    upload-url-ttl-seconds: 900

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
