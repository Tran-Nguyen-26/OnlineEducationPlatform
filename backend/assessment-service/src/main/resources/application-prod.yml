oep:
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET}
    region: ${AWS_REGION:us-east-1}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

server:
  forward-headers-strategy: framework   # honour X-Forwarded-* from the load balancer
  tomcat:
    max-swallow-size: 2MB
logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
springdoc:
  api-docs:
    enabled: false      # no API schema / Swagger UI on production
  swagger-ui:
    enabled: false

# Operational endpoints live on a separate, internal-only port (never routed by the gateway / load balancer).
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
