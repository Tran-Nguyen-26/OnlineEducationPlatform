server:
  port: 8083

spring:
  application:
    name: worker-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/oep}
    username: ${DB_USER:oep}
    password: ${DB_PASSWORD:oep}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}
