server:
  shutdown: graceful
  port: 8083

spring:
  profiles:
    default: dev   # running without SPRING_PROFILES_ACTIVE means "dev"; Docker images activate "prod"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: worker-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oep}
    username: ${DB_USER:oep}
    password: ${DB_PASSWORD:oep}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50   # collapses N+1 lazy loads into IN (...) batches
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:oep}
    password: ${RABBIT_PASSWORD:oep}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false   # failed messages are dead-lettered (see DLX), never requeued forever
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 15s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

oep:
  mail:
    enabled: ${MAIL_ENABLED:false}   # off by default: set MAIL_ENABLED=true plus MAIL_HOST/PORT/USER/PASSWORD (e.g. Amazon SES SMTP)
    from: ${MAIL_FROM:no-reply@oep.local}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:oep}
    secret-key: ${STORAGE_SECRET_KEY:oep_secret}
    bucket: ${STORAGE_BUCKET:oep-content}
    region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
