name: oep
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: oep
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro

  postgres-replica:
    image: postgres:16.14
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports:
      - "5435:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports: ["6379:6379"]

  rustfs:
    image: rustfs/rustfs:1.0.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: oep
      RUSTFS_SECRET_KEY: oep-minio-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data
      - rustfslogs:/var/log/rustfs

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: oep
      RABBITMQ_DEFAULT_PASS: oep
    ports: ["5673:5672", "15673:15672"]

volumes:
  pgdata:
  pgdata-replica:
  rustfsdata:
  rustfslogs:
