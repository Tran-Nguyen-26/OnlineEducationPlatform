name: oep
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: oep
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro

  postgres-replica:
    image: postgres:16.14
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: oep
      RABBITMQ_DEFAULT_PASS: oep
    ports: ["5673:5672", "15673:15672"]

  minio:
    image: coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oep
      MINIO_ROOT_PASSWORD: oep_secret
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console → http://localhost:9001
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  pgdata-replica:
  miniodata: