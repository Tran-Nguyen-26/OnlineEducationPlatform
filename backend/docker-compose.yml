name: oep
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: oep
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro

  postgres-replica:
    image: postgres:16.14
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports:
      - "5435:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: oep
      RABBITMQ_DEFAULT_PASS: oep
    ports: ["5673:5672", "15673:15672"]

  localstack:
    image: localstack/localstack:3.4
    ports: ["4566:4566"]
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=ap-southeast-1


volumes:
  pgdata:
  pgdata-replica:
