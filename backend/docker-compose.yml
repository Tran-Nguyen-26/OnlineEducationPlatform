name: oep
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: oep
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro

  postgres-replica:
    image: postgres:16.14
    user: postgres
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: oep
      RABBITMQ_DEFAULT_PASS: oep
    ports: ["5673:5672", "15673:15672"]

  # S3-compatible object storage standing in for GCP Cloud Storage (dev only, see CLAUDE.md).
  # lesson_contents (video/tài liệu) upload directly here via presigned PUT URL.
  minio:
    image: coollabsio/minio:latest
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: oep
      MINIO_ROOT_PASSWORD: oep_secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  # ---- Observability (docker compose --profile observability up) -------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    network_mode: host            # scrapes the services running on the host (localhost:8080-8083)
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    network_mode: host            # UI on :3000 (admin/admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]   # UI + OTLP/HTTP traces

volumes:
  pgdata:
  pgdata-replica:
  minio_data: