name: oep
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: oep
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: oep
      RABBITMQ_DEFAULT_PASS: oep
    ports: ["5673:5672", "15673:15672"]

volumes:
  pgdata:
