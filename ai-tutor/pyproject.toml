[project]
name = "oep-ai-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["integration: requires an isolated PostgreSQL database"]
