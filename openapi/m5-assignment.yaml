openapi: 3.0.3
info:
  title: OEP Module 5 - Assignments, Submissions and Grades
  version: 0.1.0
  description: |
    Contract proposal for the API gateway. Timestamps are UTC RFC 3339.
    A submitted assignment satisfies require_assignment regardless of score.
    A COMPLETED student may submit again while submissionCount is below maxSubmissions.
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
tags:
  - name: Assignments
    description: Instructor assignment management and student reading.
  - name: Submission files
    description: Presigned upload and protected download.
  - name: Submissions
    description: Student submissions and instructor review.
  - name: Grading
    description: Grade and regrade operations.
paths:
  /assignments:
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Create an assignment
      description: Course owner or authorized instructor only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
            example: { courseId: '11111111-1111-4111-8111-111111111111', lessonId: '55555555-5555-4555-8555-555555555555', title: 'Essay 1', instructions: 'Write 500 words.', deadline: '2026-10-20T17:00:00Z', maxSubmissions: 3, allowLateSubmission: false, allowText: true, allowFiles: true, maxScore: 100 }
      responses:
        '201':
          $ref: '#/components/responses/AssignmentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}/assignments:
    get:
      tags: [Assignments]
      operationId: listCourseAssignments
      summary: List assignments in a course
      description: Enrolled student or course instructor. Students need ACTIVE or COMPLETED enrollment.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged assignments
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
              example: { items: [{ id: '77777777-7777-4777-8777-777777777777', courseId: '11111111-1111-4111-8111-111111111111', lessonId: '55555555-5555-4555-8555-555555555555', title: 'Essay 1', maxSubmissions: 3, allowLateSubmission: false, allowText: true, allowFiles: true, maxScore: 100 }], page: 0, size: 20, total: 1 }
        '403':
          $ref: '#/components/responses/Forbidden'
  /assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: Read an assignment
      responses:
        '200':
          $ref: '#/components/responses/AssignmentOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Assignments]
      operationId: updateAssignment
      summary: Update assignment details
      description: Course owner or authorized instructor only. Cannot change courseId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
                instructions: { type: string }
                deadline: { type: string, format: date-time, nullable: true }
                maxSubmissions: { type: integer, minimum: 1 }
                allowLateSubmission: { type: boolean }
                allowText: { type: boolean }
                allowFiles: { type: boolean }
                maxScore: { type: number, minimum: 0 }
            example: { deadline: '2026-10-22T17:00:00Z', maxSubmissions: 4 }
      responses:
        '200':
          $ref: '#/components/responses/AssignmentOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Assignments]
      operationId: deleteAssignment
      summary: Delete an assignment without submissions
      description: Course owner or authorized instructor only; assignments with submissions return 409.
      responses:
        '204':
          description: Deleted; no response body
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /assignments/{assignmentId}/upload-url:
    post:
      tags: [Submission files]
      operationId: issueSubmissionUploadUrl
      summary: Get a presigned upload URL
      description: |
        Student with ACTIVE or COMPLETED enrollment and a remaining submission attempt.
        The URL expires after 15 minutes. Maximum 5 files per submission, each <= 20 MiB.
        The returned token is bound to student, assignment, filename, size and object.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
            example: { fileName: 'essay.pdf', fileType: 'application/pdf', fileSize: 524288 }
      responses:
        '200':
          description: Presigned upload details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
              example: { fileToken: '88888888-8888-4888-8888-888888888888', uploadUrl: 'https://storage.example/upload/opaque-signed-url', expiresAt: '2026-10-12T10:15:00Z', requiredHeaders: { 'Content-Type': 'application/pdf' } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
  /assignments/{assignmentId}/files/confirm:
    post:
      tags: [Submission files]
      operationId: confirmSubmissionFile
      summary: Confirm that a presigned upload exists
      description: Server checks storage and marks the token AVAILABLE; a pending or missing object returns 409.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileToken]
              properties:
                fileToken: { $ref: '#/components/schemas/Uuid' }
            example: { fileToken: '88888888-8888-4888-8888-888888888888' }
      responses:
        '200':
          description: Confirmed upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedFile' }
              example: { fileToken: '88888888-8888-4888-8888-888888888888', fileName: 'essay.pdf', fileType: 'application/pdf', fileSize: 524288, uploadStatus: AVAILABLE }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/FileNotReady'
  /assignments/{assignmentId}/submissions:
    post:
      tags: [Submissions]
      operationId: submitAssignment
      summary: Submit or resubmit an assignment
      description: |
        Student with ACTIVE or COMPLETED enrollment. One row per assignment and
        enrollment: resubmission replaces text and file associations and increments
        submissionCount atomically, up to maxSubmissions. A repeat of the same
        Idempotency-Key and payload returns the same submission without incrementing.
        The server decides whether the deadline has passed and sets isLate.
        A COMPLETED enrollment remains COMPLETED after resubmission.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                textContent: { type: string, minLength: 1, maxLength: 50000 }
                fileTokens:
                  type: array
                  minItems: 1
                  maxItems: 5
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Uuid' }
              anyOf:
                - required: [textContent]
                - required: [fileTokens]
            example: { textContent: 'My essay answer', fileTokens: ['88888888-8888-4888-8888-888888888888'] }
      responses:
        '200':
          $ref: '#/components/responses/SubmissionOk'
        '201':
          $ref: '#/components/responses/SubmissionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/DeadlineForbidden'
        '409':
          $ref: '#/components/responses/SubmissionConflict'
  /assignments/{assignmentId}/submissions/me:
    get:
      tags: [Submissions]
      operationId: getMyAssignmentSubmission
      summary: Read my current submission and grade
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionOk'
        '404':
          $ref: '#/components/responses/NotFound'
  /assignments/{assignmentId}/submissions/all:
    get:
      tags: [Submissions]
      operationId: listAssignmentSubmissions
      summary: List submissions for grading
      description: Course owner or authorized instructor only.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged submissions
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Submission' } }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
              example: { items: [{ id: '99999999-9999-4999-8999-999999999999', assignmentId: '77777777-7777-4777-8777-777777777777', enrollmentId: '22222222-2222-4222-8222-222222222222', submissionCount: 1, status: SUBMITTED, submittedAt: '2026-10-12T10:00:00Z', isLate: false }], page: 0, size: 20, total: 1 }
        '403':
          $ref: '#/components/responses/Forbidden'
  /submissions/{submissionId}:
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Read a submission and its grade
      description: Student owner or an instructor of the course.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{submissionId}/files/{fileId}/access-url:
    get:
      tags: [Submission files]
      operationId: getSubmissionFileAccessUrl
      summary: Get a short lived file download URL
      description: Student owner or course instructor. Never returns an object key or raw bucket URL.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - name: fileId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
          example: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
      responses:
        '200':
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
              example: { url: 'https://cdn.example/download/opaque-signed-url', expiresAt: '2026-10-12T10:05:00Z' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{submissionId}/grade:
    post:
      tags: [Grading]
      operationId: gradeSubmission
      summary: Grade a submission for the first time
      description: Course owner or authorized instructor; 409 if already graded.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeInput' }
            example: { score: 84.5, feedback: 'Good structure.' }
      responses:
        '201':
          $ref: '#/components/responses/GradeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{submissionId}/regrade:
    post:
      tags: [Grading]
      operationId: regradeSubmission
      summary: Replace a grade with audit trail and notification
      description: |
        Course owner or authorized instructor. Requires the current grade version;
        simultaneous updates with a stale version return 409. The previous score,
        regrade timestamp and reason are stored. Emits one audit entry and one
        ASSIGNMENT_GRADED notification, delivered within 60 seconds.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GradeInput'
                - type: object
                  required: [expectedVersion, reason]
                  properties:
                    expectedVersion: { type: integer, minimum: 1 }
                    reason: { type: string, minLength: 1 }
            example: { score: 88, feedback: 'Updated after review.', expectedVersion: 1, reason: 'Rubric correction' }
      responses:
        '200':
          $ref: '#/components/responses/GradeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/GradeConflict'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
      example: '77777777-7777-4777-8777-777777777777'
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
      example: '99999999-9999-4999-8999-999999999999'
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
      example: '11111111-1111-4111-8111-111111111111'
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      example: 0
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 for one submission action; reuse on retries.
      schema: { $ref: '#/components/schemas/Uuid' }
      example: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
  schemas:
    Uuid: { type: string, format: uuid }
    AssignmentInput:
      type: object
      required: [courseId, title, maxSubmissions, allowLateSubmission, allowText, allowFiles, maxScore]
      properties:
        courseId: { $ref: '#/components/schemas/Uuid' }
        lessonId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 255 }
        instructions: { type: string }
        deadline: { type: string, format: date-time, nullable: true }
        maxSubmissions: { type: integer, minimum: 1 }
        allowLateSubmission: { type: boolean }
        allowText: { type: boolean }
        allowFiles: { type: boolean }
        maxScore: { type: number, minimum: 0, maximum: 999.99 }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/AssignmentInput'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    UploadRequest:
      type: object
      required: [fileName, fileType, fileSize]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        fileType: { type: string, maxLength: 100 }
        fileSize: { type: integer, minimum: 1, maximum: 20971520 }
    UploadTicket:
      type: object
      required: [fileToken, uploadUrl, expiresAt, requiredHeaders]
      properties:
        fileToken: { $ref: '#/components/schemas/Uuid' }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        requiredHeaders: { type: object, additionalProperties: { type: string } }
    ConfirmedFile:
      type: object
      required: [fileToken, fileName, fileSize, uploadStatus]
      properties:
        fileToken: { $ref: '#/components/schemas/Uuid' }
        fileName: { type: string }
        fileType: { type: string }
        fileSize: { type: integer }
        uploadStatus: { type: string, enum: [AVAILABLE] }
    Submission:
      type: object
      required: [id, assignmentId, enrollmentId, submissionCount, status, submittedAt, isLate]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        enrollmentId: { $ref: '#/components/schemas/Uuid' }
        textContent: { type: string, nullable: true }
        files: { type: array, items: { $ref: '#/components/schemas/SubmissionFile' } }
        submissionCount: { type: integer, minimum: 1 }
        status: { type: string, enum: [SUBMITTED, PENDING_REGRADE, GRADED] }
        submittedAt: { type: string, format: date-time }
        isLate: { type: boolean }
        grade: { $ref: '#/components/schemas/Grade' }
    SubmissionFile:
      type: object
      required: [id, fileName, fileSize, uploadStatus]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fileName: { type: string }
        fileType: { type: string }
        fileSize: { type: integer }
        uploadStatus: { type: string, enum: [PENDING, UPLOADED, AVAILABLE, FAILED] }
    GradeInput:
      type: object
      required: [score]
      properties:
        score: { type: number, minimum: 0 }
        feedback: { type: string }
    Grade:
      type: object
      required: [id, submissionId, score, gradedBy, gradedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        submissionId: { $ref: '#/components/schemas/Uuid' }
        score: { type: number }
        feedback: { type: string }
        gradedBy: { $ref: '#/components/schemas/Uuid' }
        gradedAt: { type: string, format: date-time }
        previousScore: { type: number, nullable: true }
        regradedAt: { type: string, format: date-time, nullable: true }
        regradeReason: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: { type: string } }
  responses:
    AssignmentCreated:
      description: Created assignment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Assignment' }
          example: { id: '77777777-7777-4777-8777-777777777777', courseId: '11111111-1111-4111-8111-111111111111', lessonId: '55555555-5555-4555-8555-555555555555', title: 'Essay 1', maxSubmissions: 3, allowLateSubmission: false, allowText: true, allowFiles: true, maxScore: 100 }
    AssignmentOk:
      description: Assignment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Assignment' }
          example: { id: '77777777-7777-4777-8777-777777777777', courseId: '11111111-1111-4111-8111-111111111111', lessonId: '55555555-5555-4555-8555-555555555555', title: 'Essay 1', maxSubmissions: 3, allowLateSubmission: false, allowText: true, allowFiles: true, maxScore: 100 }
    SubmissionCreated:
      description: First submission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Submission' }
          example: { id: '99999999-9999-4999-8999-999999999999', assignmentId: '77777777-7777-4777-8777-777777777777', enrollmentId: '22222222-2222-4222-8222-222222222222', textContent: 'My essay answer', submissionCount: 1, status: SUBMITTED, submittedAt: '2026-10-12T10:00:00Z', isLate: false, files: [{ id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', fileName: 'essay.pdf', fileSize: 524288, uploadStatus: AVAILABLE }] }
    SubmissionOk:
      description: Current or repeated submission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Submission' }
          example: { id: '99999999-9999-4999-8999-999999999999', assignmentId: '77777777-7777-4777-8777-777777777777', enrollmentId: '22222222-2222-4222-8222-222222222222', textContent: 'Revised essay answer', submissionCount: 2, status: SUBMITTED, submittedAt: '2026-10-13T10:00:00Z', isLate: false, files: [] }
    GradeCreated:
      description: First grade
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Grade' }
          example: { id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc', submissionId: '99999999-9999-4999-8999-999999999999', score: 84.5, feedback: 'Good structure.', gradedBy: 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', gradedAt: '2026-10-13T12:00:00Z', version: 1 }
    GradeOk:
      description: Updated grade
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Grade' }
          example: { id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc', submissionId: '99999999-9999-4999-8999-999999999999', score: 88, previousScore: 84.5, regradeReason: 'Rubric correction', regradedAt: '2026-10-14T12:00:00Z', gradedBy: 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', gradedAt: '2026-10-13T12:00:00Z', version: 2 }
    BadRequest:
      description: Invalid score, allowText or allowFiles violation, or invalid payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 400, error: VALIDATION_FAILED, message: 'Score exceeds maxScore' }
    Forbidden:
      description: Access denied, including another student's submission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 403, error: FORBIDDEN, message: 'No access to this submission' }
    DeadlineForbidden:
      description: Deadline passed and late submissions are disabled
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 403, error: SUBMISSION_DEADLINE_PASSED, message: 'Late submission is not allowed' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: CONFLICT, message: 'Assignment has submissions' }
    SubmissionConflict:
      description: Submission limit, unavailable file or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            limit:
              value: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: SUBMISSION_LIMIT_REACHED, message: 'No submission attempts remain' }
            file:
              value: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: FILE_NOT_AVAILABLE, message: 'Upload is not available' }
    FileNotReady:
      description: File is still pending or missing in storage
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: FILE_NOT_AVAILABLE, message: 'Upload has not completed' }
    FileTooLarge:
      description: File exceeds 20 MiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 413, error: FILE_TOO_LARGE, message: 'File exceeds 20 MiB' }
    UnsupportedMedia:
      description: File MIME type is not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 415, error: UNSUPPORTED_MEDIA_TYPE, message: 'Unsupported file type' }
    GradeConflict:
      description: Grade does not exist or expectedVersion is stale
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: GRADE_VERSION_CONFLICT, message: 'Grade was updated by another instructor' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 404, error: NOT_FOUND, message: 'Resource not found' }
