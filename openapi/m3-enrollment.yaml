openapi: 3.0.3
info:
  title: OEP Module 3 - Enrollment and Progress
  version: 0.1.0
  description: |
    Contract proposal for the API gateway. All timestamps are UTC RFC 3339.
    The authenticated student's ID comes from the JWT, never from a request body.
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
tags:
  - name: Enrollment
    description: Course enrollment lifecycle.
  - name: Progress
    description: Student lesson activity and completion.
  - name: Instructor progress
    description: Course-level progress reporting.
paths:
  /enrollments:
    post:
      tags: [Enrollment]
      operationId: enrollInCourse
      summary: Enroll in a public published course or resume a withdrawn enrollment
      description: |
        Student only. An existing ACTIVE or COMPLETED enrollment is returned unchanged.
        WITHDRAWN is reactivated using the same row and preserved progress.
        REMOVED cannot be reactivated by the student. Capacity checks must be atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId: { $ref: '#/components/schemas/Uuid' }
            example: { courseId: '11111111-1111-4111-8111-111111111111' }
      responses:
        '201':
          description: New enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
              example: { id: '22222222-2222-4222-8222-222222222222', courseId: '11111111-1111-4111-8111-111111111111', studentId: '33333333-3333-4333-8333-333333333333', status: ACTIVE, enrolledAt: '2026-10-12T10:00:00Z' }
        '200':
          $ref: '#/components/responses/EnrollmentOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/EnrollmentConflict'
  /enrollments/me:
    get:
      tags: [Enrollment]
      operationId: listMyEnrollments
      summary: List the current student's enrollments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EnrollmentStatus' }
          example: ACTIVE
      responses:
        '200':
          description: Paged enrollments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentPage' }
              example: { items: [{ id: '22222222-2222-4222-8222-222222222222', courseId: '11111111-1111-4111-8111-111111111111', studentId: '33333333-3333-4333-8333-333333333333', status: ACTIVE, enrolledAt: '2026-10-12T10:00:00Z' }], page: 0, size: 20, total: 1 }
        '400':
          $ref: '#/components/responses/BadRequest'
  /enrollments/{enrollmentId}:
    parameters:
      - $ref: '#/components/parameters/EnrollmentId'
    get:
      tags: [Enrollment]
      operationId: getEnrollment
      summary: Read an enrollment
      description: Owner student or an instructor of its course.
      responses:
        '200':
          $ref: '#/components/responses/EnrollmentOk'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /enrollments/{enrollmentId}/withdraw:
    post:
      tags: [Enrollment]
      operationId: withdrawEnrollment
      summary: Withdraw from an active course
      description: Student owner only. Progress and submissions are retained.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Withdrawn enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
              example: { id: '22222222-2222-4222-8222-222222222222', courseId: '11111111-1111-4111-8111-111111111111', studentId: '33333333-3333-4333-8333-333333333333', status: WITHDRAWN, enrolledAt: '2026-10-12T10:00:00Z', withdrawnAt: '2026-10-13T10:00:00Z' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /enrollments/{enrollmentId}/remove:
    post:
      tags: [Enrollment]
      operationId: removeEnrollment
      summary: Remove a student from a course
      description: Course owner or authorized instructor only. Retains history; blocks student re-enrollment.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Removed enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
              example: { id: '22222222-2222-4222-8222-222222222222', courseId: '11111111-1111-4111-8111-111111111111', studentId: '33333333-3333-4333-8333-333333333333', status: REMOVED, enrolledAt: '2026-10-12T10:00:00Z', removedAt: '2026-10-13T10:00:00Z' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /courses/{courseId}/enrollments:
    get:
      tags: [Enrollment]
      operationId: listCourseEnrollments
      summary: List enrollments for a course
      description: Course owner or authorized instructor only.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged enrollments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentPage' }
              example: { items: [{ id: '22222222-2222-4222-8222-222222222222', courseId: '11111111-1111-4111-8111-111111111111', studentId: '33333333-3333-4333-8333-333333333333', status: ACTIVE, enrolledAt: '2026-10-12T10:00:00Z' }], page: 0, size: 20, total: 1 }
        '403':
          $ref: '#/components/responses/Forbidden'
  /progress/heartbeat:
    post:
      tags: [Progress]
      operationId: recordHeartbeat
      summary: Idempotently update lesson progress
      description: |
        Student owner with ACTIVE enrollment only. Send at most once per 15 seconds
        while visible. The same eventId and payload return the original result.
        A repeated eventId with different payload is 409. Older sequence numbers
        are acknowledged without adding time or moving playback backwards.
        Server caps an accepted delta to 30 seconds. One database write per accepted
        heartbeat is the target. COMPLETED, WITHDRAWN and REMOVED return 403.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID v4 identifying this heartbeat; reuse on retries.
          schema: { $ref: '#/components/schemas/Uuid' }
          example: '44444444-4444-4444-8444-444444444444'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
            example: { enrollmentId: '22222222-2222-4222-8222-222222222222', lessonId: '55555555-5555-4555-8555-555555555555', contentId: '66666666-6666-4666-8666-666666666666', sequence: 42, deltaSeconds: 15, videoPositionSeconds: 185 }
      responses:
        '200':
          description: Current progress; duplicates return this result without increasing time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonProgress' }
              example: { enrollmentId: '22222222-2222-4222-8222-222222222222', lessonId: '55555555-5555-4555-8555-555555555555', status: IN_PROGRESS, timeSpentSeconds: 120, videoPositionSeconds: 185, videoPercentage: 30.83, lastContentId: '66666666-6666-4666-8666-666666666666', lastAccessedAt: '2026-10-12T10:02:00Z' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /enrollments/{enrollmentId}/progress:
    get:
      tags: [Progress]
      operationId: listEnrollmentProgress
      summary: List lesson progress for an enrollment
      description: Owner student or an instructor of its course; history remains readable after withdrawal.
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Progress summary and lessons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSummary' }
              example: { enrollmentId: '22222222-2222-4222-8222-222222222222', requiredLessons: 10, completedRequiredLessons: 3, completionPercentage: 30, lessons: [{ enrollmentId: '22222222-2222-4222-8222-222222222222', lessonId: '55555555-5555-4555-8555-555555555555', status: IN_PROGRESS, timeSpentSeconds: 120, videoPositionSeconds: 185, videoPercentage: 30.83, lastAccessedAt: '2026-10-12T10:02:00Z' }] }
        '403':
          $ref: '#/components/responses/Forbidden'
  /enrollments/{enrollmentId}/progress/{lessonId}:
    get:
      tags: [Progress]
      operationId: getLessonProgress
      summary: Read a lesson's progress
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lesson progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonProgress' }
              example: { enrollmentId: '22222222-2222-4222-8222-222222222222', lessonId: '55555555-5555-4555-8555-555555555555', status: IN_PROGRESS, timeSpentSeconds: 120, videoPositionSeconds: 185, videoPercentage: 30.83, lastAccessedAt: '2026-10-12T10:02:00Z' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /instructor/courses/{courseId}/progress:
    get:
      tags: [Instructor progress]
      operationId: listCourseProgress
      summary: List progress by student
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged student progress
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        enrollmentId: { $ref: '#/components/schemas/Uuid' }
                        studentId: { $ref: '#/components/schemas/Uuid' }
                        completionPercentage: { type: number, minimum: 0, maximum: 100 }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
              example: { items: [{ enrollmentId: '22222222-2222-4222-8222-222222222222', studentId: '33333333-3333-4333-8333-333333333333', completionPercentage: 30 }], page: 0, size: 20, total: 1 }
        '403':
          $ref: '#/components/responses/Forbidden'
  /instructor/courses/{courseId}/summary:
    get:
      tags: [Instructor progress]
      operationId: getCourseProgressSummary
      summary: Read aggregate completion for a course
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Aggregate progress
          content:
            application/json:
              schema:
                type: object
                required: [courseId, activeCount, completedCount, completionRate]
                properties:
                  courseId: { $ref: '#/components/schemas/Uuid' }
                  activeCount: { type: integer }
                  completedCount: { type: integer }
                  completionRate: { type: number, minimum: 0, maximum: 100 }
              example: { courseId: '11111111-1111-4111-8111-111111111111', activeCount: 20, completedCount: 5, completionRate: 20 }
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
      example: '22222222-2222-4222-8222-222222222222'
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
      example: '11111111-1111-4111-8111-111111111111'
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
      example: '55555555-5555-4555-8555-555555555555'
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      example: 0
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
  schemas:
    Uuid: { type: string, format: uuid }
    EnrollmentStatus: { type: string, enum: [ACTIVE, COMPLETED, WITHDRAWN, REMOVED] }
    Enrollment:
      type: object
      required: [id, courseId, studentId, status, enrolledAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        courseId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        enrolledAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        removedAt: { type: string, format: date-time, nullable: true }
    EnrollmentPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    HeartbeatRequest:
      type: object
      required: [enrollmentId, lessonId, sequence, deltaSeconds]
      properties:
        enrollmentId: { $ref: '#/components/schemas/Uuid' }
        lessonId: { $ref: '#/components/schemas/Uuid' }
        contentId: { $ref: '#/components/schemas/Uuid' }
        sequence: { type: integer, format: int64, minimum: 1, description: 'Monotonic per enrollment and lesson.' }
        deltaSeconds: { type: integer, minimum: 0, maximum: 30 }
        videoPositionSeconds: { type: integer, minimum: 0 }
    LessonProgress:
      type: object
      required: [enrollmentId, lessonId, status, timeSpentSeconds, lastAccessedAt]
      properties:
        enrollmentId: { $ref: '#/components/schemas/Uuid' }
        lessonId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED] }
        timeSpentSeconds: { type: integer, minimum: 0 }
        videoPositionSeconds: { type: integer, minimum: 0 }
        videoPercentage: { type: number, minimum: 0, maximum: 100 }
        lastContentId: { $ref: '#/components/schemas/Uuid' }
        completedAt: { type: string, format: date-time, nullable: true }
        lastAccessedAt: { type: string, format: date-time }
    ProgressSummary:
      type: object
      required: [enrollmentId, requiredLessons, completedRequiredLessons, completionPercentage, lessons]
      properties:
        enrollmentId: { $ref: '#/components/schemas/Uuid' }
        requiredLessons: { type: integer }
        completedRequiredLessons: { type: integer }
        completionPercentage: { type: number, minimum: 0, maximum: 100 }
        lessons: { type: array, items: { $ref: '#/components/schemas/LessonProgress' } }
    Error:
      type: object
      required: [timestamp, status, error, message]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: { type: string } }
  responses:
    EnrollmentOk:
      description: Existing or reactivated enrollment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Enrollment' }
          example: { id: '22222222-2222-4222-8222-222222222222', courseId: '11111111-1111-4111-8111-111111111111', studentId: '33333333-3333-4333-8333-333333333333', status: ACTIVE, enrolledAt: '2026-10-12T10:00:00Z' }
    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 400, error: VALIDATION_FAILED, message: 'Invalid heartbeat' }
    Forbidden:
      description: Access denied or enrollment not ACTIVE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 403, error: FORBIDDEN, message: 'Active enrollment required' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 404, error: NOT_FOUND, message: 'Enrollment not found' }
    EnrollmentConflict:
      description: COURSE_FULL, COURSE_NOT_OPEN or another enrollment conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            full:
              value: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: COURSE_FULL, message: 'Course is full' }
            notOpen:
              value: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: COURSE_NOT_OPEN, message: 'Course is not open' }
    InvalidTransition:
      description: Enrollment status cannot make the requested transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: INVALID_ENROLLMENT_TRANSITION, message: 'Enrollment is not ACTIVE' }
    IdempotencyConflict:
      description: Idempotency key reused with different payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-12T10:00:00Z', status: 409, error: IDEMPOTENCY_CONFLICT, message: 'Event ID was already used' }
