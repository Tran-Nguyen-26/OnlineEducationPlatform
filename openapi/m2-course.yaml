  /contents/{contentId}/access-url:
    get:
      tags: [Files]
      operationId: getContentAccessUrl
      summary: Get a presigned content access URL
      description: |
        OWNER/CO_INSTRUCTOR or students with valid L3 entitlement in a PUBLISHED course. Student access is
        provisionally ACTIVE-only while COMPLETED access remains OPEN. PRIVATE students must first enroll
        through L3's minimal MVP invite-code flow. ARCHIVED blocks students even with ACTIVE enrollment.
        Content upload_status must be AVAILABLE. No streaming; return a short-lived presigned GET URL.
        Previously issued URLs may remain valid until expiry after removal, unpublish or archive; revocation
        is not immediate.
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessUrlResponse" }
              example:
                access_url: https://storage.example.invalid/bucket/course-content/key?signature=example
                method: GET
                expires_at: "2026-10-10T10:05:00Z"
                file_name: lecture1.pdf
