openapi: 3.0.3
info:
  title: Online Education Platform — M2 Course API
  version: 0.1.0
  description: |
    REVIEW DRAFT (2026-10-11); pending L3/L5/common alignment and team approval.
    Course -> Module -> Lesson -> Content hierarchy. Course metadata and archive-only lifecycle (no hard deletion).
    File uploads and protected access URLs without streaming.
    CO_INSTRUCTOR may edit course metadata, but cannot publish/unpublish/archive/restore or manage instructors.
    PRIVATE invite-code enrollment is included in the minimal MVP; L3 handles invite-code issuance/validation and enrollment.
    Students must enroll successfully before M2 exposes private course content.
    ARCHIVED courses deny student access, including students with ACTIVE enrollments.
    COMPLETED content access is OPEN; provisional ACTIVE-only behavior fails closed.
    Course reviews/ratings remain OPEN and are omitted from M2 until scoped.
    Pagination (page=1, page_size=20, maximum 100) and error envelope are proposals pending common approval.
    Deprecated DELETE /courses/{courseId} archives DRAFT courses only for the Co-Instructor 403 acceptance test.
    Use POST /courses/{courseId}/archive as the primary endpoint; no physical data deletion.
  x-business-decisions:
    co_instructor_metadata_edit: "CONFIRMED: allowed, except lifecycle and instructor management"
    private_invite_code:
      "CONFIRMED: minimal invite-code join is in MVP; L3 owns code validation/enrollment; details
      pending L3"
    course_delete: "PROPOSED: archive-only; deprecated DELETE alias retained for task acceptance"
    archived_student_access:
      "CONFIRMED: deny learning/content/course detail/outline and new signed access URL when
      ARCHIVED, regardless of enrollment status; prior signed URLs expire by TTL"
    lesson_completion_rules: "OPEN: coordinate scope and rules with L3"
    completed_content_access: "OPEN: provisional ACTIVE-only"
    course_reviews: "OPEN: excluded from M2 until scoped and assigned"
servers:
  - url: /api/v1
    description: Relative API base path
security:
  - bearerAuth: []
tags:
  - name: Courses
    description: Course management, owner-only lifecycle operations, and archive-only deletion.
  - name: Instructors
    description: Manage course instructors; exactly one OWNER.
  - name: Modules
    description: Manage course modules and their order.
  - name: Lessons
    description: Manage course lessons and their order.
  - name: Contents
    description: Manage lesson content metadata and order.
  - name: Files
    description: Presigned file upload and protected download without streaming.
paths:
  /courses:
    get:
      tags: [Courses]
      operationId: listPublicCourses
      summary: List public courses
      description: |
        Public catalog; no authentication required. Only PUBLIC and PUBLISHED courses are listed. PRIVATE
        courses are hidden. Reviews/ratings are not returned because their scope remains OPEN.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedCourses" }
              example:
                items:
                  - id: 11111111-1111-4111-8111-111111111111
                    title: Cloud Computing Fundamentals
                    description: Khóa học nhập môn điện toán đám mây
                    visibility: PUBLIC
                    lifecycle_status: PUBLISHED
                    capacity: 50
                    learning_mode: FREE_NAVIGATION
                    start_at:
                    end_at:
                    created_by: 55555555-5555-4555-8555-555555555555
                    created_at: "2026-10-10T10:00:00Z"
                    updated_at: "2026-10-10T10:00:00Z"
                pagination: &id002
                  page: 1
                  page_size: 20
                  total: 1
                  has_next: false
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error
                  request_id: req_abc123
                  details: {}
      security: []
      x-request-example: GET /api/v1/courses
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a course
      description: |
        Authorized INSTRUCTOR only. Creates the course and its course_instructors OWNER record in a single
        transaction.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCourse" }
            example:
              title: Cloud Computing Fundamentals
              description: Khóa học nhập môn điện toán đám mây
              visibility: PUBLIC
              capacity: 50
              learning_mode: FREE_NAVIGATION
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
              example: &id001
                id: 11111111-1111-4111-8111-111111111111
                title: Cloud Computing Fundamentals
                description: Khóa học nhập môn điện toán đám mây
                visibility: PUBLIC
                lifecycle_status: DRAFT
                capacity: 50
                learning_mode: FREE_NAVIGATION
                start_at:
                end_at:
                created_by: 55555555-5555-4555-8555-555555555555
                created_at: "2026-10-10T10:00:00Z"
                updated_at: "2026-10-10T10:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error
                  request_id: req_abc123
                  details: {}
      x-request-example: POST /api/v1/courses
      x-error-codes: [INSTRUCTOR_ROLE_REQUIRED]
  /courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Read a course
      description: |
        PUBLIC and PUBLISHED course metadata is public. PRIVATE courses are readable only by
        OWNER/CO_INSTRUCTOR or students enrolled through L3 (provisionally ACTIVE only). Students must use
        L3's invite-code enrollment before accessing private course/content; do not disclose the outline to
        non-enrolled students. DRAFT, ARCHIVED and DISABLED are visible only to OWNER, CO_INSTRUCTOR or
        ADMIN with management/audit permission. ARCHIVED denies student access even with an ACTIVE
        enrollment. COMPLETED access remains OPEN and is provisionally denied.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
              example:
                id: 11111111-1111-4111-8111-111111111111
                title: Cloud Computing Fundamentals
                description: Khóa học nhập môn điện toán đám mây
                visibility: PUBLIC
                lifecycle_status: PUBLISHED
                capacity: 50
                learning_mode: FREE_NAVIGATION
                start_at:
                end_at:
                created_by: 55555555-5555-4555-8555-555555555555
                created_at: "2026-10-10T10:00:00Z"
                updated_at: "2026-10-10T10:00:00Z"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error
                  request_id: req_abc123
                  details: {}
      security:
        - {}
        - bearerAuth: []
      x-request-example: GET /api/v1/courses/11111111-1111-4111-8111-111111111111
      x-open-decision: COMPLETED entitlement pending L3/product approval; ACTIVE-only provisional.
    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: Update course metadata
      description: |
        Course OWNER or CO_INSTRUCTOR may update title, description, visibility, capacity, learning_mode,
        start_at and end_at only when DRAFT or PUBLISHED. PATCH cannot change lifecycle_status, created_by
        or course_instructors; extra fields return 422. CO_INSTRUCTOR cannot publish, unpublish, archive,
        restore, disable or delete a course. Capacity changes must check occupied seats through L3, with the
        count definition pending L3. PUBLIC/PRIVATE changes require L3 invite-code/enrollment policy
        alignment. Return 503 (fail closed) when a required L3 check is unavailable. ARCHIVED or DISABLED
        courses cannot be edited (409).
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCourse" }
            example:
              title: Cloud Fundamentals Updated
              capacity: 50
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
              example:
                id: 11111111-1111-4111-8111-111111111111
                title: Cloud Fundamentals Updated
                description: Khóa học nhập môn điện toán đám mây
                visibility: PUBLIC
                lifecycle_status: DRAFT
                capacity: 50
                learning_mode: FREE_NAVIGATION
                start_at:
                end_at:
                created_by: 55555555-5555-4555-8555-555555555555
                created_at: "2026-10-10T10:00:00Z"
                updated_at: "2026-10-10T10:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error
                  request_id: req_abc123
                  details: {}
      x-request-example: PATCH /api/v1/courses/11111111-1111-4111-8111-111111111111
      x-error-codes:
        [
          COURSE_NOT_EDITABLE,
          CAPACITY_BELOW_OCCUPIED_COUNT,
          ENROLLMENT_CHECK_UNAVAILABLE,
          INVALID_COURSE_UPDATE,
        ]
      x-required-course-roles: [OWNER, CO_INSTRUCTOR]
    delete:
      tags: [Courses]
      operationId: deleteDraftCourse
      summary: "[Deprecated] Archive a draft course"
      description: |
        Deprecated alias retained for the acceptance test requiring 403 when a CO_INSTRUCTOR calls DELETE.
        OWNER only, and only for DRAFT courses. Changes DRAFT to ARCHIVED without physically deleting data.
        New clients should use POST /courses/{courseId}/archive. This alias may be removed if the team
        approves the POST-only API and updates the acceptance test.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
              example:
                id: 11111111-1111-4111-8111-111111111111
                title: Cloud Computing Fundamentals
                description: Khóa học nhập môn điện toán đám mây
                visibility: PUBLIC
                lifecycle_status: ARCHIVED
                capacity: 50
                learning_mode: FREE_NAVIGATION
                start_at:
                end_at:
                created_by: 55555555-5555-4555-8555-555555555555
                created_at: "2026-10-10T10:00:00Z"
                updated_at: "2026-10-10T10:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Forbidden; CO_INSTRUCTOR cannot delete/archive a course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: CO_INSTRUCTOR_CANNOT_DELETE_COURSE
                  message: Only course OWNER may archive this course
                  details: {}
                  request_id: req_abc123
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500":
          description: Internal server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error
                  request_id: req_abc123
                  details: {}
      deprecated: true
      x-request-example: DELETE /api/v1/courses/11111111-1111-4111-8111-111111111111
      x-error-codes:
        [CO_INSTRUCTOR_CANNOT_DELETE_COURSE, INVALID_LIFECYCLE_TRANSITION]
      x-required-course-roles: [OWNER]
