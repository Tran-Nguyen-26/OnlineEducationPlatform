              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error
                  request_id: req_abc123
                  details: {}
      x-request-example: POST /api/v1/courses/11111111-1111-4111-8111-111111111111/restore
      x-required-course-roles: [OWNER]
      x-error-codes:
