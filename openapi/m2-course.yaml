  /courses/{courseId}/outline:
    get:
      tags: [Courses]
      operationId: getCourseOutline
      summary: Read a course outline
      description: |
        PUBLIC and PUBLISHED courses expose a metadata-only outline, without content/file URLs. PRIVATE
        outlines are visible only to instructors or students who enrolled successfully through L3's MVP
        invite-code flow (provisionally ACTIVE only). ARCHIVED denies outline access even with ACTIVE
        enrollment. COMPLETED access remains OPEN.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
