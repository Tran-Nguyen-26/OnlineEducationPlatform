                      id: 22222222-2222-4222-8222-222222222222
                      course_id: 11111111-1111-4111-8111-111111111111
                      title: "Module 1: Introduction"
                      description: Tổng quan
                      position: 1
                      is_default: true
                      created_at: "2026-10-10T10:00:00Z"
                      updated_at: "2026-10-10T10:00:00Z"
