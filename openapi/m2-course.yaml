        error:
          code: CO_INSTRUCTOR_CANNOT_PUBLISH_COURSE
          message: Course OWNER permission required
          details: {}
          request_id: req_abc123
  /courses/{courseId}/unpublish:
    post:
      tags: [Courses]
      operationId: unpublishCourse
      summary: Unpublish a course
      description:
        OWNER only. PUBLISHED -> DRAFT. Students cannot access content until the course is published
