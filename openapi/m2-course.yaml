        updated_at: { type: string, format: date-time }
      required:
        [id, lesson_id, content_type, upload_status, position, version_number]
    CreateContent:
      type: object
      properties:
        content_type: { $ref: "#/components/schemas/ContentType" }
        title:
          type: string
          maxLength: 255
        text_content:
          type: string
        external_url: { type: string, format: uri }
        file_name:
          type: string
          maxLength: 255
        mime_type:
          type: string
          maxLength: 100
        file_size: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 0 }
      required: [content_type]
      description:
        TEXT requires text_content; LINK requires external_url; file types
        (VIDEO/PDF/SLIDE/DOCUMENT/FILE) require file_name, mime_type and file_size. Cross-field validation is
        performed by the backend.
