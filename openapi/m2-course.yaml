  /courses/{courseId}/archive:
    post:
      tags: [Courses]
      operationId: archiveCourse
      summary: Archive a course
      description: |
        OWNER only. DRAFT/PUBLISHED -> ARCHIVED; never physically deletes the course, instructor,
        enrollment, lesson or audit records. CO_INSTRUCTOR receives 403. Confirmed: ARCHIVED courses block
        student access even with ACTIVE enrollment, including course details, outline, modules, lessons,
        contents and new access URLs. Previously issued signed URLs may remain valid until their TTL
        expires; revocation is not immediate.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
              example:
                id: 11111111-1111-4111-8111-111111111111
                title: Cloud Computing Fundamentals
                description: Khóa học nhập môn điện toán đám mây
                visibility: PUBLIC
                lifecycle_status: ARCHIVED
                capacity: 50
                learning_mode: FREE_NAVIGATION
                start_at:
                end_at:
                created_by: 55555555-5555-4555-8555-555555555555
                created_at: "2026-10-10T10:00:00Z"
                updated_at: "2026-10-10T10:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
