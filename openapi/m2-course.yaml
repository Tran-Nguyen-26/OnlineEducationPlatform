components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 11111111-1111-4111-8111-111111111111
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 22222222-2222-4222-8222-222222222222
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 33333333-3333-4333-8333-333333333333
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 44444444-4444-4444-8444-444444444444
    InstructorId:
      name: instructorId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 55555555-5555-4555-8555-555555555555
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Search:
      name: q
      in: query
      description: Case-insensitive search by course title.
      schema:
        type: string
        maxLength: 200
      example: Cloud
    ContentStatus:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/UploadStatus" }
      example: AVAILABLE
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: BAD_REQUEST
              message: Thông tin yêu cầu không hợp lệ
              details: {}
              request_id: req_abc123
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: UNAUTHORIZED
              message: Thiếu hoặc token không hợp lệ
              details: {}
              request_id: req_abc123
    Forbidden:
      description: Insufficient permission to access the course or content.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: COURSE_FORBIDDEN
              message: Không đủ quyền đối với khóa học hoặc tài liệu
              details: {}
              request_id: req_abc123
    NotFound:
      description: Resource not found within this course.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Không tìm thấy tài nguyên trong khóa học này
              details: {}
              request_id: req_abc123
    Conflict:
      description: The resource state does not allow this operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: INVALID_LIFECYCLE_TRANSITION
              message: Trạng thái hiện tại không cho phép thao tác
              details: {}
              request_id: req_abc123
    PayloadTooLarge:
      description: File exceeds the upload size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: UPLOAD_TOO_LARGE
              message: File vượt giới hạn upload
              details: {}
              request_id: req_abc123
    UnsupportedMedia:
      description: Unsupported file format.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Định dạng file không được hỗ trợ
              details: {}
              request_id: req_abc123
    Unprocessable:
      description: Invalid input value (for example, page_size > 100).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_ERROR
              message: Giá trị không hợp lệ (ví dụ page_size > 100)
              details: {}
              request_id: req_abc123
    ServiceUnavailable:
      description: Enrollment verification unavailable; access is denied temporarily.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: ENROLLMENT_CHECK_UNAVAILABLE
              message: Không thể xác minh enrollment; từ chối cấp quyền tạm thời
              details: {}
              request_id: req_abc123
  schemas:
    CourseVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    CourseLifecycle:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED, DISABLED]
    LearningMode:
      type: string
      enum: [FREE_NAVIGATION, SEQUENTIAL]
    CourseRole:
      type: string
      enum: [OWNER, CO_INSTRUCTOR]
    ContentType:
      type: string
      enum: [TEXT, LINK, VIDEO, PDF, SLIDE, DOCUMENT, FILE]
    UploadStatus:
      type: string
      enum: [PENDING, UPLOADED, AVAILABLE, FAILED]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              properties: {}
              additionalProperties: true
            request_id:
              type: string
          required: [code, message, request_id]
      required: [error]
    PageInfo:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total: { type: integer, minimum: 0 }
        has_next:
          type: boolean
      required: [page, page_size, total, has_next]
    Course:
      type: object
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
        description: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/CourseVisibility" }
        lifecycle_status: { $ref: "#/components/schemas/CourseLifecycle" }
        capacity:
          type: integer
          nullable: true
          minimum: 1
        learning_mode: { $ref: "#/components/schemas/LearningMode" }
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required:
        [
          id,
          title,
          visibility,
          lifecycle_status,
          learning_mode,
          created_by,
          created_at,
          updated_at,
        ]
    CreateCourse:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        visibility: { $ref: "#/components/schemas/CourseVisibility" }
