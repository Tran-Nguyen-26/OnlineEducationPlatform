          message: Course OWNER permission required
          details: {}
          request_id: req_abc123
  /courses/{courseId}/restore:
    post:
      tags: [Courses]
      operationId: restoreCourse
      summary: Restore an archived course
      description: OWNER only. ARCHIVED -> DRAFT; the course must be published again before becoming public.
      parameters:
        - { $ref: "#/components/parameters/CourseId" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
              example: *id001
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500":
          description: Internal server error
          content:
