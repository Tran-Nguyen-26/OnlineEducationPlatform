                        module_id: 22222222-2222-4222-8222-222222222222
                        title: What is Cloud?
                        description: Khái niệm cơ bản
                        position: 1
                        is_required: true
                        created_at: "2026-10-10T10:00:00Z"
                        updated_at: "2026-10-10T10:00:00Z"
