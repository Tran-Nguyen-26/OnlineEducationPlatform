name: Playwright E2E Tests

# ══════════════════════════════════════════════════════════════════════════════
# Kiểm thử toàn trình (End-to-End) giao diện người dùng bằng Playwright:
#   - Kích hoạt trên PR vào main/dev hoặc push lên main/dev (khi thay đổi frontend/**)
#   - Hỗ trợ chế độ Soft Gate (cảnh báo mềm trong giai đoạn đang hoàn thiện UI/E2E,
#     và chặn cứng khi bật biến STRICT_QUALITY_GATE == 'true')
#   - Tự động đóng gói báo cáo HTML & Screenshots
# ══════════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Base URL for E2E tests (Leave blank to use local preview server)'
        required: false
        default: ''

concurrency:
  group: e2e-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-chromium:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: Build Frontend for Preview (Local E2E)
        if: ${{ !inputs.target_url }}
        run: npm run build
        working-directory: frontend

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E Tests (Soft/Hard Gate)
        working-directory: frontend
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ inputs.target_url }}
          STRICT_GATE: ${{ vars.STRICT_QUALITY_GATE || 'false' }}
        run: |
          if npm run test:e2e; then
            echo "✅ Playwright E2E suite passed."
          else
            if [ "$STRICT_GATE" = "true" ]; then
              echo "::error::Playwright E2E tests failed under STRICT_QUALITY_GATE mode!"
              exit 1
            else
              echo "::warning::Playwright E2E tests reported failures (Soft Gate warning mode active)."
              exit 0
            fi
          fi

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7