name: CI Quality Gate

# ══════════════════════════════════════════════════════════════════════════════
# Unified CI Orchestrator cho Pull Requests & Pushes (luồng feature -> dev -> main):
#   - Phân loại thay đổi (Path Filtering) thông qua dorny/paths-filter
#   - Kích hoạt linh hoạt các pipeline tương ứng: Backend, Frontend, Terraform IaC
#   - Cổng tổng hợp "CI Gate / Quality & Security Assurance" cung cấp single status check
#     duy nhất cho GitHub Branch Protection trên cả nhánh 'dev' và 'main', chống PR deadlock.
# ══════════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Codebase Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Evaluate Path Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/ci.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/iac-ci.yml'
              - '.github/workflows/ci.yml'

  backend-ci:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  iac-ci:
    name: Terraform IaC CI
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/iac-ci.yml
    secrets: inherit

  ci-gate:
    name: CI Gate / Quality & Security Assurance
    needs: [changes, backend-ci, frontend-ci, iac-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate CI Gate Results
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend-ci.result }}
          FRONTEND: ${{ needs.frontend-ci.result }}
          TERRAFORM: ${{ needs.iac-ci.result }}
          STRICT_MODE: ${{ vars.STRICT_QUALITY_GATE || 'false' }}
        run: |
          echo "## 🛡️ CI Gate Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch / Ref**: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Quality Gate Mode**: \`$( [ "$STRICT_MODE" = "true" ] && echo "STRICT (Blocking)" || echo "SOFT (Warning Mode)" )\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detect Changes | $CHANGES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend CI (5 Modules) | $BACKEND |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend CI (React SPA & OpenAPI) | $FRONTEND |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform IaC CI | $TERRAFORM |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHANGES" = "failure" ] || [ "$CHANGES" = "cancelled" ] || \
             [ "$BACKEND" = "failure" ] || [ "$BACKEND" = "cancelled" ] || \
             [ "$FRONTEND" = "failure" ] || [ "$FRONTEND" = "cancelled" ] || \
             [ "$TERRAFORM" = "failure" ] || [ "$TERRAFORM" = "cancelled" ]; then
            echo "❌ **CI Gate Failed!** One or more required pipeline checks did not succeed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI Gate Failed: Changes=$CHANGES, Backend=$BACKEND, Frontend=$FRONTEND, Terraform=$TERRAFORM"
            exit 1
          fi

          echo "✅ **All required CI checks passed** (skipped workflows are gracefully non-blocking)." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ CI Gate Passed successfully."