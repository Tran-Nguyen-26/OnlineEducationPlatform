name: CI

on:
  push:
    branches: [dev, dev-2, "build/**", main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install ffmpeg (video transcoder test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build, unit tests and migration test (Testcontainers needs the runner's Docker)
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    name: Docker images build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core-lms-service, context: backend, args: "MODULE=core-lms-service" }
          - { name: assessment-service, context: backend, args: "MODULE=assessment-service" }
          - { name: worker-service, context: backend, args: "MODULE=worker-service\nINSTALL_FFMPEG=true" }
          - { name: api-gateway, context: backend, args: "MODULE=api-gateway" }
          - { name: frontend, context: frontend, args: "VITE_API_BASE_URL=" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context == 'backend' && 'backend/Dockerfile' || 'frontend/Dockerfile' }}
          build-args: ${{ matrix.args }}
          push: false
          tags: oep/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-and-terraform:
    name: Compose config and Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose files are valid
        working-directory: backend
        run: |
          scripts/gen-secrets.sh
          docker compose -f docker-compose.prod.yml --env-file .env.prod config -q
          AWS_REGION=ap-southeast-1 docker compose -f docker-compose.prod.yml -f docker-compose.aws.yml --env-file .env.prod config -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt / validate
        run: |
          for d in infra/aws/ec2-demo infra/aws/ecs-managed; do
            terraform -chdir="$d" fmt -check -recursive
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
